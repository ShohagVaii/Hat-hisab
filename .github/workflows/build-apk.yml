name: Build Hat Hisab APK

# Push to main or manual "Run workflow" from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          cat archive/hat-hisab-app.zip.part-* > /tmp/hat-hisab-app.zip
          unzip -q -o /tmp/hat-hisab-app.zip
          chmod +x android/gradlew

      - name: Fetch Hind Siliguri fonts (kept out of the archive to keep it small)
        run: |
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/hindsiliguri/HindSiliguri-$w.ttf" -o "assets/fonts/HindSiliguri-$w.ttf"
          done
          ls -la assets/fonts/

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is not set. Add the 4 signing secrets first (see BUILD_ON_GITHUB.md)."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/hat-hisab-release.keystore
          cat > android/keystore.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=hat-hisab-release.keystore
          PROPS

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hat-hisab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          TAG="v$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk "hat-hisab-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "hat-hisab-$TAG.apk" --clobber
          else
            gh release create "$TAG" "hat-hisab-$TAG.apk" \
              --title "Hat Hisab $TAG" \
              --notes "Hat Hisab $TAG — built by GitHub Actions. Download the APK below and install it over the previous version."
          fi
